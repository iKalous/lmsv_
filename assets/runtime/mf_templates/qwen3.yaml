seed: 42
output_dir: '/dev/shm/checkpoints'
load_checkpoint: ''
load_ckpt_format: 'safetensors'
src_strategy_path_or_dir: ''
auto_trans_ckpt: False
only_save_strategy: False
resume_training: False
use_parallel: True
run_mode: 'train'
use_legacy: False

# Trainer configuration
trainer:
  type: CausalLanguageModelingTrainer
  model_name: 'Qwen3'

# Runner configuration
runner_config:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 1

# Optimizer configuration
optimizer:
  type: AdamW
  betas: [0.9, 0.95]
  eps: 1.e-8
  weight_decay: 0.0

# Learning rate scheduler configuration
lr_schedule:
  type: ConstantWarmUpLR
  learning_rate: 1.e-6
  warmup_ratio: 0
  total_steps: -1

# Dataset configuration
train_dataset: &train_dataset
  data_loader:
    type: BlendedMegatronDatasetDataLoader
    datasets_type: "GPTDataset"
    sizes:
      - 100
      - 0
      - 0
    config:
      seed: 1234
      split: "1, 0, 0"
      seq_length: 4096
      eod_mask_loss: False
      reset_position_ids: False
      create_attention_mask: True
      reset_attention_mask: False
      create_compressed_eod_mask: False
      eod_pad_length: 128
      eod: 1
      pad: -1
      data_path:
        - '1'
        - "/dev/shm/dataset/wiki_4096_text_document"
  input_columns: ["input_ids", "labels", "loss_mask", "position_ids", "attention_mask"]
  construct_args_key: ["input_ids", "labels", "loss_mask", "position_ids", "attention_mask"]
  num_parallel_workers: 8
  python_multiprocessing: False
  drop_remainder: True
  numa_enable: False
  prefetch_size: 1
  seed: 1234
train_dataset_task:
  type: CausalLanguageModelDataset
  dataset_config: *train_dataset

# MindSpore context configuration
context:
  mode: 0
  device_target: "Ascend"
  max_device_memory: "58GB"
  memory_optimize_level: "O0"
  jit_config:
    jit_level: "O0"
  ascend_config:
    precision_mode: "must_keep_origin_dtype"
    parallel_speed_up_json_path: "./assets/runtime/configs/qwen3/parallel_speed_up.json"

# Parallel configuration
parallel_config:
  data_parallel: &dp 1
  model_parallel: 1
  pipeline_stage: 1
  micro_batch_num: 1
  use_seq_parallel: False
  gradient_aggregation_group: 1

# Parallel context configuration
parallel:
  parallel_mode: 1
  enable_alltoall: True
  full_batch: False
  dataset_strategy: [
      [*dp, 1],
      [*dp, 1],
      [*dp, 1],
      [*dp, 1],
      [*dp, 1],
      [*dp, 1, 1, 1]
    ]
  search_mode: "sharding_propagation"
  strategy_ckpt_config:
    save_file: None
    only_trainable_params: False
  enable_parallel_optimizer: False
  parallel_optimizer_config:
    gradient_accumulation_shard: False
    parallel_optimizer_threshold: 64
    optimizer_weight_shard_size: -1

# Recomputation configuration
recompute_config:
  recompute: True
  select_recompute: False
  parallel_optimizer_comm_recompute: True
  mp_comm_recompute: True

# Model configuration
model:
  model_config:
    vocab_size: 151936
    hidden_size: 2048
    intermediate_size: 6144
    num_hidden_layers: 28
    num_attention_heads: 16
    num_key_value_heads: 8
    head_dim: 128
    hidden_act: 'swiglu'
    max_position_embeddings: 4096
    seq_length: 4096
    initializer_range: 0.02
    rms_norm_eps: 1.e-6
    use_cache: True
    tie_word_embeddings: False
    rope_theta: 1000000.
    attention_bias: False
    add_bias_linear: False
    eos_token_id: 151645
    pad_token_id: 151643
    bos_token_id: 151643
    attention_dropout: 0.0
    hidden_dropout: 0.0
    input_sliced_sig: True
    untie_embeddings_and_output_weights: True
    position_embedding_type: "rope"
    qk_layernorm: True
    use_contiguous_weight_layout_attention: False
    qkv_concat: True
    offset: [-1, -1, 1, 1]
    params_dtype: "float32"
    compute_dtype: "bfloat16"
    layernorm_compute_dtype: "float32"
    softmax_compute_dtype: "float32"
    rotary_dtype: "float32"
    fp32_residual_connection: True
    model_type: "qwen3"
    architectures: ["Qwen3ForCausalLM"]

# Callbacks configuration
callbacks:
  - type: MFLossMonitor

# Wrapper cell configuration
runner_wrapper:
  type: MFTrainOneStepCell
  scale_sense: 1.0
  use_clip_grad: True

profile: False
profile_start_step: 1
profile_stop_step: 10
init_start_profile: False
profile_communication: False
profile_memory: True
layer_scale: False
layer_decay: 0.65
lr_scale_factor: 256
